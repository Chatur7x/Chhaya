name: chaaya
description: "Chaaya — Offline Communication & Survival Platform"
publish_to: 'none'

version: 1.0.2+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Networking
  dio: ^5.4.1
  web_socket_channel: ^2.4.3

  # Storage
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  sqflite: ^2.3.2

  # BLE Mesh
  flutter_blue_plus: ^1.31.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Crypto & HTTP
  pointycastle: ^3.9.1
  encrypt: ^5.0.3
  cryptography: ^2.5.0
  http: ^1.2.0
  crypto: ^3.0.5
  uuid: ^4.3.3
  convert: ^3.1.1

  # Biometric Auth
  local_auth: ^2.2.0

  # Audio & Voice
  record: ^6.0.0
  audioplayers: ^6.0.0
  flutter_p2p_connection: any

  # Camera & Media
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  mime: ^1.0.5
  # flutter_webrtc: ^0.11.0  # TODO: Re-add when compatible version available

  # Location & Maps
  geolocator: ^12.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Sensors
  sensors_plus: ^4.0.2
  battery_plus: ^6.0.0

  # Notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  stomp_dart_client: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

