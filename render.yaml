services:
  - type: web
    name: chhaya-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend/server
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: API_RATE_LIMIT
        value: "100"
      - key: API_AUTH_RATE_LIMIT
        value: "600"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chhaya-db
          property: connectionString

databases:
  - name: chhaya-db
    region: singapore
    plan: free
    ipAllowList: []
    postgresMajorVersion: "16"
    databaseName: chhaya
    user: chhaya
