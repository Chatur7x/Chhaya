# Android debug build — compiles Kotlin (including app-native plugins)
# on every app-touching PR so uncompiled native code can never merge.
#
# NOTE (repo layout): Flutter lives at the repo root (there is no
# `app/` directory), so this is a separate workflow file: per-job path
# filters are not possible inside ci.yml, and top-level paths there
# would wrongly gate the backend job too.
name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/android-build.yml'

jobs:
  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to match local dev SDK. Update BOTH files when bumping.
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter pub get
      - run: flutter build apk --debug
