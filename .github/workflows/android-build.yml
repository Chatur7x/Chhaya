# Android debug and release builds — compile Kotlin (including app-native
# plugins) and catch release-only registration issues on every app change.
#
# NOTE (repo layout): Flutter lives at the repo root (there is no
# `app/` directory), so this is a separate workflow file: per-job path
# filters are not possible inside ci.yml, and top-level paths there
# would wrongly gate the backend job too.
name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, platform/ios-foundation, 'codex/**']
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/chhaya_pqc/**'
      - 'analysis_options.yaml'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/chhaya_pqc/**'
      - 'analysis_options.yaml'
      - '.github/workflows/android-build.yml'

jobs:
  android-build:
    name: Android debug + release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to match local dev SDK. Update BOTH files when bumping.
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - run: yes | sdkmanager --licenses || true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: flutter build apk --release --target-platform android-arm64
      - name: Save installable Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: Chhaya-Android-Test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
