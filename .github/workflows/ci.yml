name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to match local dev SDK. Update BOTH files when bumping.
          flutter-version: "3.47.1"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test

  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chhaya
          POSTGRES_PASSWORD: chhaya
          POSTGRES_DB: chhaya
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U chhaya" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://chhaya:chhaya@localhost:5432/chhaya
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/server/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
