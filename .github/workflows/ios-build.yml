name: iOS Build
on:
  workflow_dispatch:
  push:
    branches: [main, platform/ios-foundation, 'codex/**']
    paths: ['ios/**', 'lib/**', 'test/**', 'packages/chhaya_pqc/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/ios-build.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', 'lib/**', 'test/**', 'packages/chhaya_pqc/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --config-only --debug --no-codesign
      - run: cd ios && pod install --repo-update
      - run: flutter build ios --debug --no-codesign
      - name: Package unsigned iOS developer build
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app Chhaya-iOS-UNSIGNED.app.zip
      - name: Save unsigned iOS developer build
        uses: actions/upload-artifact@v4
        with:
          name: Chhaya-iOS-UNSIGNED-Developer-Build
          path: Chhaya-iOS-UNSIGNED.app.zip
          if-no-files-found: error
          retention-days: 30
      - run: flutter analyze --no-pub
        if: always()
      - run: flutter test --no-pub
        if: always()
