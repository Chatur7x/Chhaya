name: iOS Build
on:
  push:
    branches: [main, platform/ios-foundation]
    paths: ['ios/**', 'lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/ios-build.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', 'lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - run: flutter pub get
      - run: cd ios && pod install --repo-update
      - run: flutter build ios --debug --no-codesign
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
