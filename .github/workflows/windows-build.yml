name: Windows Build
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['windows/**', 'lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/windows-build.yml']
  pull_request:
    branches: [main]
    paths: ['windows/**', 'lib/**', 'test/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/windows-build.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --debug
      - run: flutter test --no-pub test/unit/ui/voice_recorder_test.dart test/unit/messaging/voice_temporary_files_test.dart test/integration/windows_sqlcipher_test.dart
      - name: Save Windows developer build
        uses: actions/upload-artifact@v4
        with:
          name: Chhaya-Windows-Developer-Build
          path: build/windows/x64/runner/Debug/
          if-no-files-found: error
          retention-days: 14
