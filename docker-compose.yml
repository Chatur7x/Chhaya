services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chhaya
      POSTGRES_USER: chhaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U chhaya -d chhaya']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  chhaya-api:
    build: ./backend/server
    environment:
      DATABASE_URL: postgresql://chhaya:${POSTGRES_PASSWORD}@postgres:5432/chhaya
      TRUST_PROXY_HOPS: 1
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-100}
      API_AUTH_RATE_LIMIT: ${API_AUTH_RATE_LIMIT:-600}
    expose: ['8443']
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8443/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 20s
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports: ['443:443']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [chhaya-api]
    restart: unless-stopped
volumes:
  postgres_data:
