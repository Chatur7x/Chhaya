version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chhaya
      POSTGRES_USER: chhaya
      POSTGRES_PASSWORD: chhaya
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chhaya -d chhaya"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chhaya-api:
    build:
      context: ./backend/server
      dockerfile: Dockerfile
    ports:
      - "8443:8443"
      - "8444:8444"
      - "8445:8445"
      - "9090:9090"
    environment:
      DATABASE_URL: postgresql://chhaya:chhaya@postgres:5432/chhaya
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 8443
      SIGNALING_PORT: 8444
      ONION_PORT: 8445
      METRICS_PORT: 9090
      JWT_SECRET: ${JWT_SECRET:-chhaya-production-secret-change-me}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - chhaya-api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: