services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chhaya
      POSTGRES_USER: chhaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U chhaya -d chhaya']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  chhaya-api:
    build: ./backend/server
    environment:
      DATABASE_URL: postgresql://chhaya:${POSTGRES_PASSWORD}@postgres:5432/chhaya
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    expose: ['8443', '8444']
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports: ['443:443']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [chhaya-api]
    restart: unless-stopped
volumes:
  postgres_data:
