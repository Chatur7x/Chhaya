name: chaaya
description: "Chhaya - The Ultimate Secure Messenger. Combining Threema + Session privacy with Apple-grade UI."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  # State Management
  flutter_riverpod: ^2.6.1

  # Cryptography
  pointycastle: ^3.9.1
  crypto: ^3.0.6
  convert: ^3.1.2

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # UI Enhancements
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1

  # Permissions & Platform
  permission_handler: ^11.4.0

  # WebRTC (Real P2P Voice/Video)
  flutter_webrtc: ^0.12.5+hotfix.1

  # Biometric Authentication
  local_auth: ^2.3.0

  # Notifications and File Pickers
  flutter_local_notifications: ^17.2.2
  file_picker: ^8.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

