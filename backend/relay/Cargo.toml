[package]
name = "chaaya-swarm-relay"
version = "10.0.0"
edition = "2021"
description = "Chaaya SwarmRelay v10 — Production Encrypted Media Relay (Axum + Tokio)"
authors = ["Chaaya Team"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.6"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
