spring:
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://db.supabase.co:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours

supabase:
  url: ${SUPABASE_URL:https://xyz.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY:your-anon-key}
