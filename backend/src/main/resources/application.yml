server:
  port: 8080

spring:
  application:
    name: catus-chat-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/meshlink_db
    driverClassName: org.postgresql.Driver
    username: postgres
    password: postgres
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    enabled: true

logging:
  level:
    root: INFO
    com.proj16.backend: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: bXktc2VjcmV0LWtleS1mb3ItY2hhYXlhLW1lc2hsaW5rLTIwMjU=
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
